name: Deploy portfolio
on:
  workflow_run:
    workflows: [Portfolio checks]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: Cloudflare environment
        required: true
        type: choice
        options: [preview, production]
        default: preview
permissions:
  contents: read
concurrency:
  group: portfolio-deployment-${{ inputs.target || 'production' }}
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.CLOUDFLARE_DEPLOYS_ENABLED == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.id == github.repository_id)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: portfolio-${{ inputs.target || 'production' }}
    env:
      DEPLOY_ENV: ${{ inputs.target || 'production' }}
      SOURCE_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
      SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_WEB_ANALYTICS_TOKEN }}
      PREVIEW_ORIGIN: ${{ vars.PREVIEW_ORIGIN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_REVISION }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Check deployment prerequisites
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$PUBLIC_TURNSTILE_SITE_KEY"
          if [ "$DEPLOY_ENV" = production ]; then
            test "$SOURCE_BRANCH" = main
            test -n "$PUBLIC_CF_WEB_ANALYTICS_TOKEN"
          else
            test -n "$PREVIEW_ORIGIN"
          fi
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils libc++1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm check && pnpm test && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser checks on the release artifact
        run: pnpm test:browser --project=chromium --workers=2
      - name: Deploy preview
        if: env.DEPLOY_ENV == 'preview'
        run: pnpm deploy:preview
      - name: Deploy production
        if: env.DEPLOY_ENV == 'production'
        run: pnpm deploy:production
      - name: Verify deployed routes and contact readiness
        env:
          TEST_ORIGIN: ${{ env.DEPLOY_ENV == 'production' && 'https://michaeldadi.dev' || vars.PREVIEW_ORIGIN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: deployed-${{ env.DEPLOY_ENV }}-${{ env.SOURCE_REVISION }}
          path: dist/
          retention-days: 14
